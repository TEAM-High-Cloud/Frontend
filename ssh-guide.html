    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
            <div class="container px-4">
                <a class="navbar-brand fw-bold text-primary" href="index.html">HighCloud</a>
                <a class="btn btn-sm btn-outline-secondary" href="index.html#Guide"><i class="bi-arrow-left"></i> 이전</a>
            </div>
        </nav>

        <section class="py-5">
            <div class="container px-4" style="max-width: 800px;">
                <div class="bg-white p-5 rounded-3 shadow-sm">
                    <h2 class="fw-bold mb-3 text-dark"><i class="bi-globe text-primary me-2"></i>SSH 접속 가이드</h2>
                    <p class="text-muted mb-4">인스턴스 생성 시 등록한 키페어 파일(.pem)을 이용하여 가상 서버에 원격 접속하는 방법입니다.</p>
                    
                    <hr class="my-4" />

                    <div class="terminal-guide-zone">
                        <ul class="list-unstyled lh-lg text-dark p-0 m-0">
                            <li class="mb-4 fs-5 fw-bold">
                                1. 터미널 창 실행
                            </li>
                            
                            <li class="mb-4">
                                <div class="fs-5 fw-bold">2. 다운로드 받은 키페어 파일이 위치한 폴더로 이동</div>
                                <div class="bg-dark text-light p-3 rounded my-2 font-monospace fs-6">
                                    cd
                                </div>
                            </li>
                            
                            <li class="mb-2">
                                <div class="fs-5 fw-bold">3. ssh 접속 명령어로 vm 접속</div>
                                <div class="bg-dark text-light p-3 rounded my-2 font-monospace fs-6">
                                    ssh -i 키페어파일이름 ubuntu@112.218.95.58 -p 포트번호
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>
